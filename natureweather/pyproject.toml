[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "naturev1"
version = "0.13.0"
description = "Probabilistic weather and hurricane model: geometric-attention backbone, tropical-cyclone physics that beats extrapolation, a satellite-fed particle swarm with Caribbean parish impacts, multi-teacher distillation, data assimilation"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nathan" }]
keywords = ["weather", "hurricane", "tropical-cyclone", "forecasting", "particle-filter", "caribbean", "impact-forecasting", "distillation", "data-assimilation", "goes", "satellite", "geometric-deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>=2.5", "ihelix>=0.6.0", "numpy>=1.24"]

[project.optional-dependencies]
satellite = ["xarray>=2023.1", "netCDF4>=1.6"]
corpora = ["xarray>=2023.1", "zarr>=2.16", "gcsfs>=2023.1"]
hub = ["huggingface_hub>=0.20"]
swarm = ["eccodes>=2.37", "pillow>=9", "matplotlib>=3.6", "xarray>=2023.1", "netCDF4>=1.6"]
all = ["xarray>=2023.1", "netCDF4>=1.6", "huggingface_hub>=0.20", "zarr>=2.16", "gcsfs>=2023.1", "safetensors>=0.4",
       "eccodes>=2.37", "pillow>=9", "matplotlib>=3.6"]

[project.urls]
Source = "https://github.com/Wisk-inc/transformers/tree/main/natureweather"

[tool.hatch.build.targets.wheel]
packages = ["naturev1"]
