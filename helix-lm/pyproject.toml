[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-lm"
version = "2.6.0"
description = "HELIX, ANANSI and TriStream-2: linear-scaling sequence architectures with exact long-range recall, the engine that trains them (Muon, muP, growth), a music stack (analysis, frisson critic, conductor, separation, singing voice conversion), and Pinxit, a painter that works stroke by stroke"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nathan" }]
maintainers = [{ name = "Nathan" }]
keywords = [
    "transformer",
    "attention",
    "linear-attention",
    "long-context",
    "state-space-model",
    "delta-rule",
    "sparse-attention",
    "associative-recall",
    "coding-agent",
    "pretraining",
    "pytorch",
    "singing-voice-synthesis",
    "voice-conversion",
    "music-information-retrieval",
    "audio-codec",
    "stroke-based-rendering",
    "painting",
    "style-transfer",
    "animation",
    "text-to-video",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "torch>=2.6",
    "numpy>=1.24",
    "safetensors>=0.4",
    "tokenizers>=0.20",
    "huggingface_hub>=0.25",
    "pyarrow>=15",
    "zstandard>=0.22",
]

[project.optional-dependencies]
kernels = ["flash-linear-attention>=0.3"]
eval = ["lm_eval>=0.4.5", "evalplus>=0.3"]
jamaica = ["pypdf>=4"]
music = ["soundfile>=0.12", "demucs>=4.0"]
paint = ["pillow>=9", "transformers>=4.49", "diffusers>=0.32", "peft>=0.13", "accelerate>=0.30", "imageio-ffmpeg>=0.5"]
dev = ["pytest>=7", "ruff>=0.6"]
all = ["helix-lm[kernels,eval,jamaica,music,paint]"]

[project.urls]
Homepage = "https://github.com/Wisk-inc/transformers/tree/main/helix-lm"
Source = "https://github.com/Wisk-inc/transformers/tree/main/helix-lm"
Issues = "https://github.com/Wisk-inc/transformers/issues"

[project.scripts]
helix = "helix_lm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/helix_lm"]

[tool.hatch.build.targets.sdist]
include = ["src/helix_lm", "tests", "docs", "notebooks", "README.md", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["docs/pinxit"]           # the sample pictures: in the repository, not in the source package

[tool.ruff]
line-length = 119
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["B008", "E741"]

[tool.pytest.ini_options]
testpaths = ["tests"]
